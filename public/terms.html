<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Terms & Policy</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.9);
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --accent: #6366f1;
      --border: rgba(148, 163, 184, 0.18);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 24px 16px;
    }
    .container {
      width: 100%;
      max-width: 620px;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 28px 24px;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.45);
    }
    .header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 22px;
      padding-bottom: 18px;
      border-bottom: 1px solid var(--border);
    }
    .badge {
      background: linear-gradient(135deg, var(--primary), var(--accent));
      width: 48px;
      height: 48px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      box-shadow: 0 4px 14px rgba(56, 189, 248, 0.3);
    }
    h1 {
      font-size: 1.45rem;
      font-weight: 700;
      color: var(--text);
    }
    .subtitle {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 3px;
    }
    .content {
      font-size: 0.96rem;
      line-height: 1.7;
      color: #e2e8f0;
      white-space: pre-wrap;
      word-break: break-word;
      background: rgba(15, 23, 42, 0.6);
      padding: 18px;
      border-radius: 12px;
      border: 1px solid var(--border);
    }
    .close-btn {
      display: block;
      width: 100%;
      margin-top: 24px;
      padding: 14px;
      background: linear-gradient(135deg, #0284c7, #4f46e5);
      color: white;
      text-align: center;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(2, 132, 199, 0.35);
      transition: transform 0.15s, opacity 0.2s;
    }
    .close-btn:hover {
      opacity: 0.92;
      transform: translateY(-1px);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="badge">📜</div>
      <div>
        <h1 id="terms-title">Terms & Policy</h1>
        <div class="subtitle" id="terms-subtitle">Official Community Guidelines & Compliance</div>
      </div>
    </div>
    <div class="content" id="terms-body">Loading terms & conditions...</div>
    <button class="close-btn" id="close-btn" onclick="closeWindow()">Understood & Close</button>
  </div>

  <script>
    if (window.Telegram && window.Telegram.WebApp) {
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();
    }

    function closeWindow() {
      if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.close) {
        window.Telegram.WebApp.close();
      } else {
        window.close();
      }
    }

    async function loadTerms() {
      try {
        const res = await fetch('api/terms');
        if (!res.ok) throw new Error('API request failed');
        const data = await res.json();
        document.getElementById('terms-title').textContent = data.title || 'Terms & Policy';
        document.getElementById('terms-body').textContent = data.content || 'No terms content set yet.';
        if (data.lastUpdated) {
          document.getElementById('terms-subtitle').textContent = `Last updated: ${data.lastUpdated} • Community Guidelines`;
        }
      } catch (err) {
        document.getElementById('terms-body').textContent = 'Unable to load terms at this time. Please contact the bot administrator.';
      }
    }

    loadTerms();
  </script>
</body>
</html>
