<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Terms & Policy</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.85);
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --accent: #6366f1;
      --border: rgba(148, 163, 184, 0.15);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 24px 16px;
    }
    .container {
      width: 100%;
      max-width: 600px;
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 28px 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }
    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }
    .badge {
      background: linear-gradient(135deg, var(--primary), var(--accent));
      width: 44px;
      height: 44px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
    }
    h1 {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--text);
    }
    .subtitle {
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .content {
      font-size: 0.95rem;
      line-height: 1.65;
      color: #e2e8f0;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .close-btn {
      display: block;
      width: 100%;
      margin-top: 24px;
      padding: 12px;
      background: linear-gradient(135deg, #0284c7, #4f46e5);
      color: white;
      text-align: center;
      border: none;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .close-btn:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="badge">📜</div>
      <div>
        <h1 id="terms-title">Terms & Policy</h1>
        <div class="subtitle">Please read before participating</div>
      </div>
    </div>
    <div class="content" id="terms-body">Loading terms...</div>
    <button class="close-btn" id="close-btn" onclick="closeWebApp()">Understood & Close</button>
  </div>

  <script>
    if (window.Telegram && window.Telegram.WebApp) {
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();
    }

    function closeWebApp() {
      if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.close) {
        window.Telegram.WebApp.close();
      } else {
        window.close();
      }
    }

    async function loadTerms() {
      try {
        const res = await fetch('/api/config');
        const data = await res.json();
        if (data.terms) {
          document.getElementById('terms-title').textContent = data.terms.title || 'Terms & Policy';
          document.getElementById('terms-body').textContent = data.terms.content || '';
        }
      } catch (err) {
        document.getElementById('terms-body').textContent = 'Unable to load terms. Please contact admin.';
      }
    }

    loadTerms();
  </script>
</body>
</html>
